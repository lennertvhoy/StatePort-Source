formatVersion: stateport.application-experience/v1
applicationId: studystate.sample
displayName: StudyState Sample
description: A public-safe learning application with a native goal, activity, evidence, and reminder flow.
capabilities:
  - conversation
  - progress_dashboard
  - goal_execution
  - proactive_notifications
views:
  - viewId: sample-learning-home
    label: Learning
    component: progress_overview
    route: /application
    capability: progress_dashboard
  - viewId: sample-study-conversation
    label: Conversation
    component: conversation_thread
    route: /conversation
    capability: conversation
  - viewId: sample-next-activity
    label: Next activity
    component: goal_actions
    route: /application/activity
    capability: goal_execution
  - viewId: sample-review-reminders
    label: Reminders
    component: notification_feed
    route: /application/notifications
    capability: proactive_notifications
navigation:
  - contributionId: sample-learning-home-nav
    label: Learning
    viewId: sample-learning-home
    placement: application
    order: 10
  - contributionId: sample-study-conversation-nav
    label: Conversation
    viewId: sample-study-conversation
    placement: conversation
    order: 20
  - contributionId: sample-next-activity-nav
    label: Next activity
    viewId: sample-next-activity
    placement: application
    order: 30
  - contributionId: sample-reminder-nav
    label: Reminders
    viewId: sample-review-reminders
    placement: application
    order: 40
conversation:
  enabled: true
  mode: application_attached
  component: conversation_thread
  title: Study conversation
  emptyState: Continue your learning conversation from any bound channel.
advancedControls:
  - controlId: sample-study-state
    label: Learning state
    component: state_summary
    capability: progress_dashboard
    order: 10
  - controlId: sample-study-history
    label: Activity history
    component: activity_history
    capability: progress_dashboard
    order: 20
  - controlId: sample-study-context
    label: Context
    component: context_summary
    capability: conversation
    order: 30
  - controlId: sample-study-runs
    label: Governed runs
    component: run_history
    capability: goal_execution
    order: 35
  - controlId: sample-study-receipts
    label: Receipts
    component: receipt_list
    capability: goal_execution
    order: 40
platformOperations: []
legacyAliases: []
