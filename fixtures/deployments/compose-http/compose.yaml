name: compose-http
services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    command: [python3, app.py]
    working_dir: /app
    user: "10001:10001"
    ports: ["127.0.0.1:0:8080"]
    networks: [internal]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      start_period: 5s
    environment:
      FIXTURE_MODE: compose
networks:
  internal: {}
