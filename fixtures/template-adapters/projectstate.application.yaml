formatVersion: stateport.application/v1
applicationId: stateport.template.projectstate
displayName: ProjectState
description: An isolated ProjectState workspace backed by StatePort-owned actions.
sourceProfile: managed-template:projectstate-v6
managedTemplateAdapter: projectstate-v6
productionEligible: true
privacyClassification: private_by_default
catalogVisible: false
actionsPath: actions/projectstate.yaml
executorCommand: scripts/template_actions.py
validationCommand: python3 -c "import pathlib,yaml; root=pathlib.Path('.'); value=yaml.safe_load((root/'STATE.yaml').read_text()); assert (root/'PROJECT.md').is_file() and value.get('version') == 'projectstate-template-v6'"
