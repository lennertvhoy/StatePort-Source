formatVersion: statedd.template-manifest/v1
templateId: classdd
templateVersion: 0.1.0
files:
  - path: .statedd/contract.md
    source: .statedd/contract.md
    owner: template
    provision: copy
    merge: replace
    generation: none
    required: true
    schema: null
    sensitivity: public
  - path: .statedd/manifest.yaml
    source: .statedd/manifest.yaml
    owner: template
    provision: copy
    merge: replace
    generation: none
    required: true
    schema: null
    sensitivity: public
  - path: README.md
    source: README.md
    owner: template
    provision: copy
    merge: replace
    generation: none
    required: true
    schema: null
    sensitivity: public
  - path: instance.yaml
    owner: instance
    provision: create
    merge: preserve
    generation: none
    required: true
    schema: statedd.stateport.io/instance/v1alpha1
    sensitivity: private
  - path: state/class.yaml
    owner: instance
    provision: create
    merge: preserve
    generation: none
    required: true
    schema: null
    sensitivity: private
  - path: state/students.yaml
    owner: instance
    provision: create
    merge: preserve
    generation: none
    required: true
    schema: null
    sensitivity: private
  - path: state/topics.yaml
    owner: instance
    provision: create
    merge: preserve
    generation: none
    required: true
    schema: null
    sensitivity: private
  - path: .statedd/lock.yaml
    owner: generated
    provision: generate
    merge: replace
    generation: materializer
    required: true
    schema: statedd.stateport.io/lock/v1
    sensitivity: internal
