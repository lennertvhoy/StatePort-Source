alpinePackages:
  release: "3.23"
  repository: https://dl-cdn.alpinelinux.org/alpine/v3.23/main
  # The web image's AppServer validates the mounted product root's Git
  # identity and runs approved filesystem transactions under Bubblewrap.
  # Alpine Git carries no Perl dependency chain; exact versions fail closed
  # when the v3.23 repository rolls forward, never silently drift.
  # libcrypto3/libssl3/sqlite-libs are exact-pinned security upgrades of the
  # python base image's own packages (the upstream rebuilt tag still ships
  # 3.5.7-r0/3.51.2-r0); every alpine-based runtime image pins the same
  # versions against the base's default v3.23 repositories.
  packages:
    git: 2.52.0-r0
    bubblewrap: 0.12.0-r0
    libcrypto3: 3.5.8-r0
    libssl3: 3.5.8-r0
    sqlite-libs: 3.53.4-r0

executionHostAlpine:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/edge/main
    - https://dl-cdn.alpinelinux.org/alpine/edge/community
  # podman-remote is a client-only dependency of the isolated execution host.
  # Pin the complete edge dependency closure because these repositories are
  # mutable and the release build must fail rather than drift.
  packages:
    aardvark-dns: 2.1.0-r0
    catatonit: 0.2.1-r0
    conmon: 2.2.1-r0
    containers-common: 0.69.1-r0
    crun: 1.28-r0
    glib: 2.88.3-r0
    json-c: 0.19-r1
    libblkid: 2.42.2-r1
    libbsd: 0.12.2-r0
    libcap2: 2.78-r0
    libeconf: 0.8.4-r0
    libgcc: 15.2.0-r9
    libintl: 1.0-r0
    libmd: 1.2.0-r0
    libmount: 2.42.2-r1
    libseccomp: 2.6.0-r2
    linux-pam: 1.7.1-r2
    netavark: 2.1.0-r0
    passt: 2026.07.28-r0
    pcre2: 10.48-r0
    skalibs-libs: 2.15.1.0-r0
    shadow-libs: 4.18.0-r1
    shadow-subids: 4.18.0-r1
    utmps-libs: 0.1.3.4-r0

