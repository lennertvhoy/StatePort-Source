compatibility:
  strategy: additive_aliases_before_physical_renames
  publicMigrationStatus: in_progress
  publicIntroductionText: formerly called
  preserveUntilVersionedMigration:
    - repository_names_and_remote_urls
    - schema_ids_and_format_versions
    - package_and_module_names
    - filesystem_paths_and_dot_directories
    - command_names_and_environment_variables
    - database_fields_and_persisted_event_ids
    - backlog_ids_branch_names_and_git_history
    - locks_receipts_bundles_fixtures_and_release_digests
  allowedRemainingCategories:
    - compatibility_alias
    - machine_identifier
    - historical_record
    - legal_text
    - archived_reference
  completionGate: no_unclassified_legacy_public_or_operator_usage
  legalTextRequiresSeparateReview: true
  archivesRemainFrozen: true
