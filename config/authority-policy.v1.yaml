      - update_project_state
      - commit
      - network_access
      - provider_access
      - push_private_branch
      - open_draft_pr
      - merge
      - delegate_subagent
    approveScopeOnce:
      - push_integration_branch
    autoAndNotify: []
    deny: []
  custom:
    default: ask_each_time
    autoWithReceipt: []
    approveScopeOnce: []
    autoAndNotify: []
    deny: []
hardDeny:
  - force_push
  - history_rewrite
  - disable_safety_gates
mergeRequirements:
  - exact_head_verified
  - required_gates_passed
subagentDefaultDeny:
  - push_integration_branch
  - update_project_state
  - merge
  - tag
  - public_release
  - deployment
  - plan_deployment
  - apply_deployment
  - collect_deployment_logs
  - restart_deployment
  - remove_deployment_runtime
  - backup_deployment_data
  - restore_deployment_data
  - purge_deployment_data
  - repository_visibility_change
  - destructive_remote_action
  - real_secret_use
  - modify_authority_policy
  - close_authority_scope
  - delegate_subagent
escalationConditions:
  - outside_standing_grant
  - repository_or_runtime_identity_uncertain
  - safety_gate_failed
  - unrelated_work_at_risk
  - sensitive_capability_required
  - irreversible_or_public_consequence
  - budget_exceeded
  - conflicting_policy_rules
  - result_unverifiable
