profiles:
  guarded:
    default: ask_each_time
    autoWithReceipt:
      - inspect_repository
      - analyze
      - run_tests
    approveScopeOnce: []
    autoAndNotify: []
    deny: []
  balanced:
    default: ask_each_time
    autoWithReceipt:
      - inspect_repository
      - analyze
      - run_tests
      - edit_scoped_files
      - create_managed_worktree
      - export_workspace_evidence
      - retire_owned_worktree
      - close_authority_scope
      - routine_cleanup
      - update_project_state
      - commit
    approveScopeOnce:
      - classify_workspace
      - network_access
      - provider_access
      - push_private_branch
      - open_draft_pr
      - delegate_subagent
    autoAndNotify: []
    deny: []
  delegated:
    default: ask_each_time
    autoWithReceipt:
      - inspect_repository
      - analyze
      - run_tests
      - launch_local_process
      - edit_scoped_files
      - classify_workspace
      - create_managed_worktree
      - export_workspace_evidence
      - retire_owned_worktree
