      platform.
    evidence: >
      Raw grype scan and scan-evaluation JSON under
      ~/.local/state/stateport/missions/public-alpha-completion-20260801/release-evidence-891ab08/stateport-web/;
      advisory text names Windows NTLM; image is Alpine Linux.
    remediation: >
      Keep Alpine git pinned and re-scan every release build; drop the
      exception if a Linux-applicable fixed package appears.
    expiresOn: "2026-09-15"
