  - id: RX-2026-164
    advisory: GO-2026-6179
    package: golang.org/x/mod
    packageVersion: v0.38.0
    artifactPath: /usr/local/bin/gh
    images: [stateport-dev-workspace]
    severity: High
    surface: >
      Go module checksum-database code recorded in the gh 2.98.0 module graph.
      The optional developer-workspace image builds the exact upstream cli/cli
      commit a255baf71d13fe5947a4eb7ad521ffd412d64cee with Go 1.26.7.
    reachability: >
      Exploitation requires a Go module fetch against an attacker-controlled
      GOPROXY. gh is a GitHub API CLI and never performs Go module fetches. The
      exact stripped probe binary contains only x/mod semver and sumdb/note
      symbols; the vulnerable sumdb client and tlog packages are not linked.
    evidence: >
      Candidate-v23-r36 scan evidence is retained under
      ~/.local/state/stateport/qualification/J1/J1-IQ-RUN-027-fresh-candidate/.candidate-v23-r36.evidence/;
      the exact gh 2.98.0 build-info, Syft, Grype, and linked-symbol evidence is
      bound by gh-2.98.0-go6303-probe-r1/receipt.json in the same run root.
    remediation: >
      Rebuild gh from the first upstream cli/cli release that vendors
      golang.org/x/mod >= 0.40.0, re-scan the image, and remove this exception.
    expiresOn: "2026-09-15"
