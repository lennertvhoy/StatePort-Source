  - id: RX-2026-005
    advisory: CVE-2026-15308
    package: python
    packageVersion: "3.13.14"
    images: [stateport-web, stateport-api, stateport-worker, stateport-runner, stateport-execution-host]
    severity: High
    surface: >
      CPython html.parser CPU denial of service on crafted markup input.
    reachability: >
      StatePort services do not feed untrusted remote markup into Python
      html.parser; frontend rendering happens in the browser, and no
      package or app imports html.parser for network input (grep-verified).
      No fixed 3.13.x exists at scan time (fix listed only on 3.15.0).
    evidence: >
      Raw grype scan and scan-evaluation JSON under
      ~/.local/state/stateport/missions/public-alpha-completion-20260801/release-evidence-891ab08/;
      html.parser non-usage verified by grep over packages/ and apps/.
    remediation: >
      Rebase runtime images onto the fixed CPython release when published
      for the pinned base image; re-scan every release build.
    expiresOn: "2026-09-15"
