formatVersion: stateport.release-scan-exceptions/v1
resolvedOn: "2026-09-04"
# Typed, expiring vulnerability-scan exceptions. An exception never weakens
# the gate for any finding it does not exactly name: the collector fails the
# image on every unexplained Critical or High finding, on an expired record,
# on a record whose image list does not include the scanned image, and on an
# advisory/package mismatch. Every record carries its surface, reachability
# analysis, evidence pointer, remediation plan, and an expiry date; a release
# assembled after expiry refuses the finding again.
#
# Evidence roots for the retained evaluations:
#   ~/.local/state/stateport/missions/public-alpha-completion-20260801/
#     release-evidence-891ab08/<image>/ (raw grype scan + scan-evaluation JSON)
#   operator://mission-evidence/public-alpha-completion-20260803/
#     release-evidence/alpha-build-2026-08-03-r5/stateport-execution-host/
# The npm-bundled-tree class in stateport-dev-workspace and the whole
# stateport-playwright npm tree were REMEDIATED (not excepted): dev-workspace
# overlays npm 12.0.2 + brace-expansion 5.0.9 (pinned digests in
# config/container-build-inputs.yaml); playwright removes npm from the
# runtime image entirely. Only the true residuals below carry exceptions.
exceptions:
  - id: RX-2026-003
    advisory: CVE-2026-11940
    package: python
    packageVersion: "3.13.14"
    images: [stateport-web, stateport-api, stateport-worker, stateport-runner, stateport-execution-host]
    severity: High
    surface: >
      CPython tarfile extraction-filter bypass. StatePort instance-backup
      code uses tarfile, so the library surface exists in the images.
    reachability: >
      StatePort restores only operator-local, digest-bound backup archives
      produced by its own backup path; tar archives are never fetched from
      or supplied by a network attacker. The only fixed CPython is the
      3.15 line (3.15.0b4), a beta the runtime cannot adopt; no 3.13.x fix
      exists at scan time.
    evidence: >
      Raw grype scan and scan-evaluation JSON under
      ~/.local/state/stateport/missions/public-alpha-completion-20260801/release-evidence-891ab08/;
      restore path review in packages/instance-backup (operator-local
      digest-bound archives only).
    remediation: >
      Rebase runtime images onto the fixed CPython release as soon as a
      fixed 3.13.x (or stable 3.15.0) is published on the pinned base
      image; re-scan every release build.
    expiresOn: "2026-09-15"
