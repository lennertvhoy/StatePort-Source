  - id: RX-2026-166
    advisory: GO-2026-6303
    package: golang.org/x/crypto
    packageVersion: v0.50.0
    artifactPath: /usr/bin/podman-remote
    images: [stateport-execution-host]
    severity: High
    surface: >
      SSH server authentication callback handling in the x/crypto module
      recorded inside the exact source-built Podman 5.8.3 remote client.
    reachability: >
      Exploitation requires ssh.NewServerConn and its serverAuthenticate path.
      The exact Podman source has no caller outside vendored server.go, while
      the r37 binary links ssh.NewClientConn but neither vulnerable server
      symbol. StatePort forces this client through the execution user's local
      rootless Podman Unix socket and exposes no SSH server.
    evidence: >
      Candidate-v24-r37 scan evidence is retained under
      ~/.local/state/stateport/qualification/J1/J1-IQ-RUN-027-fresh-candidate/.candidate-v24-r37.evidence/;
      exact source, archive, binary, module, symbol, and runtime-path evidence
      is bound by podman-remote-go6303-reachability-r1/receipt.json in the same
      run root.
    remediation: >
      Rebuild from the first released compatible Podman remote client that
      vendors golang.org/x/crypto >= 0.55.0, re-scan the image, and remove this
      exception. Do not substitute an unreleased dependency overlay.
    expiresOn: "2026-09-15"
