formatVersion: stateport.packaged-content/v1
policy:
  sourceControlMetadata: forbidden
  runtimeState: forbidden
  privateMaterial: forbidden
  broadRepositoryCopies: forbidden
  exactTrackedPathsOnly: true
  forbiddenPathParts: [.git, .github, private, secrets, release-output, docs/audit, __pycache__]

profiles:
  stateport-api:
    finalImageSources:
      - apps/api/src
      - apps/runner/src
      - config/statespec-schema-registry.v1.json
      - fixtures/apps/studystate-sample
      - images/bin/stateport-healthcheck
      - packages/api-auth/src
      - packages/approval-gate/src
      - packages/audit-log/src
      - packages/container-runner/src
      - packages/governed-api/src
      - packages/governed-runner/src
      - packages/observability/src
      - packages/quota-engine/src
      - packages/statedd-core/src
      - packages/template-validator/src
      - requirements/runtime-linux-amd64.txt
      - schemas
  stateport-worker:
    finalImageSources:
      - apps/worker/src
      - config/statespec-schema-registry.v1.json
      - images/bin/stateport-healthcheck
      - packages/approval-gate/src
      - packages/audit-log/src
      - packages/container-runner/src
      - packages/governed-runner/src
      - packages/observability/src
      - packages/quota-engine/src
      - packages/release-contracts/src
      - packages/statedd-core/src
      - packages/template-validator/src
      - requirements/runtime-linux-amd64.txt
      - schemas
  stateport-runner:
    finalImageSources:
      - apps/runner/src
      - config/statespec-schema-registry.v1.json
      - images/bin/stateport-healthcheck
      - packages/statedd-core/src
      - packages/template-validator/src
      - requirements/runtime-linux-amd64.txt
      - schemas
  stateport-execution-host:
    finalImageSources:
      - apps/execution-host/src
      - images/bin/stateport-healthcheck
      - packages/deployment/src
      - packages/execution-host/src
  stateport-web:
    buildOnlySources:
      - apps/web
    finalImageSources:
      - VERSION
      - apps/admin-cli/src
      - apps/runner/src
      - apps/telegram-adapter/src
      - apps/web/container-service.py
      - apps/web/package-lock.json
      - apps/web/package.json
      - config/application-experience-policy.yaml
      - config/context-lifecycle.v1.yaml
      - config/functionality-preservation.v1.yaml
      - config/statespec-schema-registry.v1.json
      - fixtures/application-experiences/checklist-state.yaml
