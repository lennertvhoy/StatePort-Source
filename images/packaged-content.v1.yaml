      - fixtures/application-experiences/managed-studystate.yaml
      - fixtures/application-experiences/managed-template.yaml
      - fixtures/application-experiences/study-state.yaml
      - fixtures/application-experiences/studystate-sample.yaml
      - fixtures/apps/checklistdd
      - fixtures/apps/development-reference
      - fixtures/apps/studystate-sample
      - fixtures/apps/synthetic-reference
      - fixtures/host/synthetic-capabilities.json
      - fixtures/template-adapters
      - images/bin/stateport-healthcheck
      - packages/api-auth/src
      - packages/api-native-adapter/src
      - packages/application-experience/src
      - packages/approval-gate/src
      - packages/audit-log/src
      - packages/codex-adapter/src
      - packages/container-opencode/src
      - packages/container-runner/src
      - packages/context-lifecycle/src
      - packages/contribution-bundle/src
      - packages/contribution-bundle-v2/src
      - packages/conversation-service/src
